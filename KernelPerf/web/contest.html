<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KernelPerf Contests</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <h1>KernelPerf Contests</h1>
      <a class="header-link" href="/">Performance dashboard</a>
    </header>
    <main class="contest-main">
      <table class="contest-table">
        <thead>
          <tr>
            <th>contest-id</th>
            <th>name</th>
            <th>start time</th>
            <th>created time</th>
          </tr>
        </thead>
        <tbody id="contestRows"></tbody>
      </table>
      <p id="contestEmpty" class="muted" hidden>No contests have been created.</p>
      <p id="contestError" class="error-text" hidden></p>
    </main>
    <script src="/static/contest-list.js"></script>
  </body>
</html>
