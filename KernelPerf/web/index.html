<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KernelPerf</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/" aria-label="QiWu KernelPerf home">
          <img class="brand-logo" src="/static/qiwu-logo.png" alt="QiWu" />
          <span class="brand-product">KernelPerf</span>
        </a>
        <nav class="site-nav" aria-label="KernelPerf navigation">
          <a class="site-nav-link active" href="/">Results</a>
          <a class="site-nav-link" href="/submit">Submit</a>
          <a class="site-nav-link" id="leaderboardLink" href="/contest">Leaderboard</a>
        </nav>
      </div>
    </header>
    <main class="results-page">
      <section class="page-heading">
        <div>
          <p class="eyebrow">QiWu / KernelPerf</p>
          <h1>Benchmark results</h1>
          <p class="page-copy">Inspect SpMV performance and evaluation status across submitted implementations.</p>
        </div>
        <div id="queue" class="queue-status" aria-live="polite"></div>
      </section>
      <div class="results-workspace">
        <aside class="filter-sidebar">
          <section>
            <div class="section-heading">
              <p class="eyebrow">Result scope</p>
              <h2>Filters</h2>
            </div>
            <label>Jobs<select id="jobFilter" multiple></select></label>
            <label>Backends<select id="backendFilter" multiple></select></label>
            <label>Suites<select id="suiteFilter" multiple></select></label>
            <button class="primary-button" id="refresh">Refresh results</button>
          </section>
          <section class="worker-section">
            <div class="section-heading">
              <p class="eyebrow">Execution</p>
              <h2>Workers</h2>
            </div>
            <div id="workers"></div>
          </section>
        </aside>
        <section id="plots" aria-label="Benchmark result plots"></section>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
