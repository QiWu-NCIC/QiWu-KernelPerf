[project]
name = "kernelperf"
version = "0.1.0"
description = "Unified test service for AI-generated kernels across benchmark suites and hardware backends."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
kernelperf = "kernelperf.cli:main"

[tool.setuptools.packages.find]
include = ["kernelperf*", "benchmarks*"]

[tool.setuptools.package-data]
benchmarks = ["**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.h", "**/*.cl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
