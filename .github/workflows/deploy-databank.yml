name: Deploy databank

on:
  push:
    branches: [main]
    paths:
      - "databank/**"
      - "KernelPerf/submissions/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: databank/package-lock.json
      - working-directory: databank
        run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # `enablement` requires a token other than GITHUB_TOKEN, otherwise it
          # fails with "requires a token other than GITHUB_TOKEN to be provided".
          # PAGES_PAT is a repository secret holding a PAT with the `repo` scope
          # (falling back to GITHUB_TOKEN if the secret is not configured).
          enablement: true
          token: ${{ secrets.PAGES_PAT || github.token }}
      - working-directory: databank
        run: npm run audit:spmv
      - working-directory: databank
        env:
          VITE_PUBLIC_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: databank/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ secrets.PAGES_PAT || github.token }}
